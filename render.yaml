# Render Blueprint Specification (Official)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hyperagent
    runtime: docker
    region: oregon # or ohio, frankfurt, singapore
    # 'starter' plan (1 CPU / 1GB RAM) is recommended to ensure Chromium runs smoothly
    # without running out of memory. If using 'free', ensure single-tab browsing.
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # --- Networking & Server ---
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: WEB_DIST
        value: "/app/web"

      # --- Model Credentials & Providers ---
      # Primary planner (System 2): Direct Claude API (recommended)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: "anthropic"
      - key: PLANNER_THINKING
        value: "auto"  # think only on hard turns; "1" every turn, "0" never
      - key: PLANNER_EFFORT
        value: "medium"

      # Planner models default per provider (Claude API ids for "anthropic"). Only set LLM_MODELS with ids
      # that match LLM_PROVIDER: OpenRouter-style "anthropic/..." ids are rejected by the Claude API.
      - key: AGENT_VISION
        value: "0"

      # System 1: TypeSafe Jev (Sub-second calibrated actions)
      - key: TYPESAFE_API_KEY
        sync: false
      - key: TYPESAFE_MODEL
        value: "jev-latest"
      - key: FAST_MIN_CONFIDENCE
        value: "0.4"

      # Text helper for Jev's TYPE_TEXT actions: uses Claude Haiku via ANTHROPIC_API_KEY by default.

      # --- Browser Engine ---
      - key: HEADLESS
        value: "1"
      - key: START_PAGE_URL
        value: "https://www.bing.com/"
      - key: SEARCH_URL
        value: "https://www.bing.com/search?q={}"
      # Optional remote CDP endpoint (e.g. Browserbase, Steel, Browserless)
      - key: BROWSER_WS_URL
        sync: false

      # --- Safety, Budgets & Limits ---
      - key: MAX_STEPS
        value: "60"
      - key: MAX_RUN_SECONDS
        value: "900"
      - key: MAX_SESSIONS
        value: "2" # each session runs its own Chromium; 2 leaves headroom on a 1 GB instance
      - key: MAX_RUN_COST_USD
        value: "3.0"
      - key: MAX_SOCKETS_PER_IP
        value: "4"
      - key: IDLE_CLOSE_SECONDS
        value: "300"
      - key: ALLOW_PRIVATE_NETWORK
        value: "0"

      # --- Persistence Paths ---
      - key: STORAGE_STATE_PATH
        value: ".hyperagent/storage_state.json"
      - key: DOMAIN_MEMORY_PATH
        value: ".hyperagent/domain_memory.json"
      - key: RUNS_DIR
        value: ".hyperagent/runs"
